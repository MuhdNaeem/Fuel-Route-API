services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fuel_route_api
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - ORS_API_KEY=${ORS_API_KEY:-}
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
